services:
  # Express Backend Web Service
  - type: web
    name: cardflow-backend
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: cardflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Static Site Frontend Web Service
  - type: web
    name: cardflow-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://cardflow-backend.onrender.com/api/v1

databases:
  - name: cardflow-db
    databaseName: credit_card_db
    user: postgres
